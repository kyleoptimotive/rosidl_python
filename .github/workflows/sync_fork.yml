name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * 0'  # Runs weekly at midnight UTC on Sunday
  push:
    branches:
      - humble

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: humble
          fetch-depth: 0

      - name: Configure Git
        run: |
          echo "🔧 Configuring Git settings..."
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Add upstream remote
        run: |
          echo "🔗 Adding upstream remote repository..."
          git remote add upstream https://github.com/ros2/rosidl_python.git
          echo "📋 Current remotes:"
          git remote -v

      - name: Fetch upstream
        run: |
          echo "⬇️ Fetching from upstream..."
          git fetch upstream
          
      - name: Check for changes
        id: check_changes
        run: |
          echo "🔍 Checking for new changes from upstream..."
          if git merge-base --is-ancestor upstream/humble humble; then
            echo "✨ Branch is already up to date!"
          else
            echo "🔄 New changes detected!"
            echo "changes_exist=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync fork
        if: steps.check_changes.outputs.changes_exist == 'true'
        run: |
          echo "🔄 Syncing fork with upstream..."
          git checkout humble
          git merge upstream/humble
          echo "⬆️ Pushing changes to origin..."
          git push origin humble
          echo "✅ Sync completed successfully!"