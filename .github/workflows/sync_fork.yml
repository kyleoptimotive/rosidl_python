name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * 0'  # Runs weekly on Sunday at midnight UTC
  push:
    branches:
      - humble
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: humble
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/ros2/rosidl_python.git
          git remote -v

      - name: Fetch upstream
        run: |
          git fetch upstream humble
          
      - name: Check for changes
        id: check_changes
        run: |
          git merge-base --is-ancestor upstream/humble humble && echo "No changes to sync" || echo "changes_exist=true" >> $GITHUB_OUTPUT

      - name: Sync fork
        if: steps.check_changes.outputs.changes_exist == 'true'
        run: |
          git checkout humble
          git merge upstream/humble
          git push origin humble